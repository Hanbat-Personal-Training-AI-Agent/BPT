server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  config:
    import: "optional:classpath:application-secret.yml"
  application:
    name: bpt-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bpt_db}
    username: ${DB_USERNAME:bpt_user}
    # 비밀값은 기본값 없이 환경변수 또는 application-secret.yml(git 제외)에서만 받는다.
    # 둘 다 없으면 서버가 시작하지 않는다 (공개된 기본값으로 조용히 뜨는 것보다 낫다).
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

jwt:
  # base64 인코딩한 32바이트 이상 무작위 값 (예: openssl rand -base64 48).
  # Modal 캘리브레이션 서버(bpt-jwt)와 같은 값이어야 한다.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000 # 1 hour
  refresh-token-expiration-ms: 1209600000 # 14 days

logging:
  level:
    com.bpt.kori: DEBUG
    org.hibernate.SQL: DEBUG
